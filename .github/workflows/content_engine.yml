name: Agasobanuye Content Engine

on:
  workflow_dispatch: # Allows you to click the manual "Run workflow" button
  schedule:
    - cron: '0 * * * *' # Runs exactly once every hour to manage video rendering safely

jobs:
  build-and-post:
    runs-on: ubuntu-22.04 # Locked to 22.04 to prevent libasound2 errors

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Locked to 3.10 for Playwright stability

      - name: Install Video Engine (FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Content Engine
        env:
          # --- NEW TELEGRAM UPLINK SECRETS ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python social_agent.py

      - name: Save Memory (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add memory.json
          git commit -m "Update memory.json" || exit 0
          git push
